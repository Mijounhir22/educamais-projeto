        <section>
            <h2>Formulário de Cadastro</h2>
            <p>Preencha os campos abaixo para se inscrever em nossos cursos:</p>

            <form>
                <label>Nome:</label><br>
                <input type="text" placeholder="Digite seu nome completo"><br><br>

                <label>Email:</label><br>
                <input type="email" placeholder="exemplo@email.com"><br><br>

                <label>Curso de Interesse:</label><br>
                <input type="text" placeholder="Qual curso você deseja?"><br><br>

                <button type="submit">Enviar Cadastro</button>
            </form>
        </section>
